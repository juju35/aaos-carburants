exclude: ^scripts/tiles/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Store texts are pasted as is in the Play Console: no trailing newline.
        exclude: ^play/listing/
      - id: check-yaml
      - id: check-json
      - id: check-xml
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
