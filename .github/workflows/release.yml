name: Release

# Publishes a GitHub release whenever main carries a version that has no tag yet:
# bump appVersion in app/build.gradle.kts, add its CHANGELOG.md section, push, and the release follows.
# Signed with the upload key from the secrets SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD,
# SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD; without them, with the debug key (emulator / adb only).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION="$(sed -n 's/^val appVersion = "\(.*\)"$/\1/p' app/build.gradle.kts)"
          test -n "$VERSION"
          grep -q "^## $VERSION$" CHANGELOG.md || { echo "::error::No CHANGELOG.md section for $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.version.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        if: steps.version.outputs.exists == 'false'

      - name: Build APK and bundle
        if: steps.version.outputs.exists == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export SIGNING_KEYSTORE="$RUNNER_TEMP/upload.jks"
          else
            echo "::warning::No signing secrets: release signed with the debug key (not accepted by Google Play)"
          fi
          ./gradlew --no-daemon assembleRelease bundleRelease
          VERSION="${{ steps.version.outputs.version }}"
          cp app/build/outputs/apk/release/app-release.apk "carburants-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "carburants-$VERSION.aab"
          .github/scripts/release-notes.sh "$VERSION" > notes.md
          test -s notes.md

      - name: Annotations
        if: failure()
        run: .github/scripts/sarif-annotations.sh app/build/reports/*.sarif

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            carburants-${{ steps.version.outputs.version }}.apk
            carburants-${{ steps.version.outputs.version }}.aab
          body_path: notes.md
          make_latest: true
