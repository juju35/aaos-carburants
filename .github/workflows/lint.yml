name: Lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1
        env:
          # Their own jobs below report them as annotations.
          SKIP: detekt,jscpd,android-lint

  ruff:
    name: Ruff (annotations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3

  detekt:
    name: Detekt + ktlint (Kotlin quality, dead code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew --no-daemon detekt
      - name: Annotations
        if: always()
        run: .github/scripts/sarif-annotations.sh app/build/reports/detekt/detekt.sarif
      # Also in code scanning (Security tab), even when the job fails.
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('app/build/reports/detekt/detekt.sarif') != ''
        with:
          sarif_file: app/build/reports/detekt/detekt.sarif
          category: detekt

  android-lint:
    name: Android lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew --no-daemon lintDebug
      - name: Annotations
        if: always()
        run: .github/scripts/sarif-annotations.sh app/build/reports/lint-results-debug.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('app/build/reports/lint-results-debug.sarif') != ''
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: android-lint

  duplication:
    name: Duplication (jscpd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: npx --yes jscpd@5.4.2 .
